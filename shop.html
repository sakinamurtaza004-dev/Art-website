<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Collection | Sakina Art Blog</title>
<meta name="description" content="Original paintings, resin art, painted t-shirts, home décor and gifting pieces – each one handmade and unique.">
<link rel="icon" href="assets/icons/paint.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/cart.css">
<link rel="stylesheet" href="css/shop.css">
</head>
<body data-page="shop">
<div id="site-header"></div>
<main class="shop">

  <div class="page-head shop-banner">
    <div class="paint-band" id="band" aria-hidden="true"></div>
    <div class="flora sb sb1 float" data-flora="palette"></div>
    <div class="flora sb sb2 float s2" data-flora="brush"></div>
    <div class="flora sb sb3 float s3" data-flora="flower"></div>
    <div class="flora sb sb4 float" data-flora="sprig"></div>
    <div class="wrap">
      <span class="eyebrow">Ready to find a home</span>
      <h1 data-paint>The Collection</h1>
      <p>Original art and handmade pieces — each one unique</p>
    </div>
  </div>

  <section class="shop-body">
    <div class="flora d bg" data-flora="bloom" style="width:480px;height:480px;left:-160px;top:-40px"></div>
    <div class="flora d bg" data-flora="bloom2" style="width:520px;height:520px;right:-180px;bottom:200px"></div>
    <div class="wrap wide">
      <div class="fbar" id="filters" role="group" aria-label="Filter the collection"></div>
      <div class="masonry" id="shop-grid" aria-live="polite"></div>
    </div>
  </section>
</main>

<!-- product detail: opens like a turned page -->
<div class="pm" id="pm" hidden role="dialog" aria-modal="true" aria-label="Product details">
  <div class="pm-back" data-close></div>
  <div class="pm-panel" id="pm-panel">
    <button type="button" class="pm-x" data-close aria-label="Close">×</button>
    <div class="pm-scroll" id="pm-body"></div>
    <div class="pm-wash" id="pm-wash" aria-hidden="true"></div>
  </div>
</div>

<div id="site-footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/cart.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
