<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Sakina Art Blog</title>
<link rel="icon" href="assets/icons/paint.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/cart.css">
</head>
<body data-page="contact">
<div id="site-header"></div>
<main>
<div class="page-head">
  <div class="flora corner tl float" data-flora="palette"></div><div class="flora corner tr float s3" data-flora="brush"></div>
  <div class="wrap"><span class="eyebrow">Get in touch</span><h1 data-paint>Contact</h1><p>Questions, ideas or a custom order – reach out any way you like.</p></div>
</div>
<section style="padding-top:40px">
  <div class="flora corner bl" data-flora="tube"></div>
  <div class="wrap">
    <div class="contact-grid">
      <div class="contact-card reveal"><h3>WhatsApp</h3><p>The fastest way to reach me</p><a class="btn sage solid sm" id="c-wa" target="_blank" rel="noopener">Chat now</a></div>
      <div class="contact-card reveal"><h3>Email</h3><p id="c-mail-t"></p><a class="btn sm" id="c-mail">Send email</a></div>
      <div class="contact-card reveal"><h3>Instagram</h3><p id="c-ig-t"></p><a class="btn sm" id="c-ig" target="_blank" rel="noopener">Follow</a></div>
    </div>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/cart.js"></script>
<script>
  document.getElementById('c-wa').href = 'https://wa.me/' + CFG.whatsapp;
  document.getElementById('c-mail').href = 'mailto:' + CFG.email;
  document.getElementById('c-mail-t').textContent = CFG.email;
  document.getElementById('c-ig').href = CFG.instagram;
  document.getElementById('c-ig-t').textContent = CFG.handle;
</script>
</body>
</html>
